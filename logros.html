<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión Espacial — Pa ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="estrellas-fondo" aria-hidden="true"></div>

<div id="cabecera"></div>

<main>
  <section class="seccion">
    <h2 class="seccion__titulo">Mi Astronauta Favorita</h2>

    <div class="tira-logros" id="tiraLogros"></div>

    <div class="panel-juego" style="max-width:420px; margin:1.6rem auto 0; text-align:center; padding:1.6rem;">
      <button id="botonDesbloquear" class="boton boton--primario">Desbloquear mensaje especial </button>
    </div>
  </section>
</main>

<div id="modalEspecial" class="modal" hidden>
  <div class="modal__lluvia" aria-hidden="true"></div>
  <div class="modal__contenido tarjeta" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <button class="modal__cerrar" id="botonCerrarModal" aria-label="Cerrar">✕</button>
    <div class="modal__insignia"></div>
    <h3 id="modalTitulo">¡Desbloqueado!</h3>
    <p id="modalMensaje" class="modal__mensaje"></p>
    <button id="botonGuardarLogro" class="boton boton--primario">Guardar</button>
  </div>
</div>

<script src="comun.js"></script>
<script src="logros.js"></script>
</body>
</html>
